<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Vidrensic forensic evidence platform</title>
  <desc id="desc">A dark technical hero with the Vidrensic shield and evidence-focused capability labels.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="analysis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="30" fill="#07111C"/>
  <rect width="1200" height="380" rx="30" fill="url(#grid)"/>
  <g transform="translate(72 66)">
