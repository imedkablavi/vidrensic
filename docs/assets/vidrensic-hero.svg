    <path d="m60 76 58 116 58-116" fill="none" stroke="url(#line)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="104" r="34" fill="#0a1728" stroke="#67e8f9" stroke-width="6"/>
    <path d="m109 87 29 17-29 17Z" fill="#e0f2fe"/>
  </g>
  <g transform="translate(338 88)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="70" fill="#f8fafc" font-size="72" font-weight="800" letter-spacing="4">VIDRENSIC</text>
    <text x="3" y="113" fill="#94a3b8" font-size="24" font-weight="500">DVR / NVR evidence reconstruction &amp; video forensics</text>
    <rect x="3" y="145" width="730" height="4" rx="2" fill="url(#line)" opacity=".9"/>
    <g font-size="17" font-weight="600">
