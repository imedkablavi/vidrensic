      <g transform="translate(174)"><rect width="158" height="44" rx="22" fill="#10253A" stroke="#38BDF8" stroke-opacity=".5"/><text x="79" y="28" text-anchor="middle" fill="#BAE6FD">Multi-format</text></g>
      <g transform="translate(346)"><rect width="174" height="44" rx="22" fill="#171C3C" stroke="#6366F1" stroke-opacity=".55"/><text x="87" y="28" text-anchor="middle" fill="#C7D2FE">Reconstruction</text></g>
      <g transform="translate(534)"><rect width="178" height="44" rx="22" fill="#0D2B2B" stroke="#34D399" stroke-opacity=".5"/><text x="89" y="28" text-anchor="middle" fill="#A7F3D0">Auditable QA</text></g>
