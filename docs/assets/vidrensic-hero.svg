      <g transform="translate(181 182)"><rect width="160" height="42" rx="21" fill="#10253a" stroke="#38bdf8" stroke-opacity=".45"/><text x="80" y="27" text-anchor="middle" fill="#bae6fd">Multi-format</text></g>
      <g transform="translate(353 182)"><rect width="190" height="42" rx="21" fill="#121f3d" stroke="#6366f1" stroke-opacity=".5"/><text x="95" y="27" text-anchor="middle" fill="#c7d2fe">Auditable recovery</text></g>
      <g transform="translate(555 182)"><rect width="178" height="42" rx="21" fill="#102c32" stroke="#34d399" stroke-opacity=".45"/><text x="89" y="27" text-anchor="middle" fill="#a7f3d0">Forensic QA</text></g>
    </g>
