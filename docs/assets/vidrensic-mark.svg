<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vidrensic mark</title>
  <desc id="desc">A forensic shield containing a video play symbol, lens and fragment nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0f2340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M256 62 397 112v120c0 100-58 170-141 218-83-48-141-118-141-218V112L256 62Z" fill="#07101c" stroke="url(#accent)" stroke-width="18"/>
  <path d="M168 170 256 342 344 170" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="210" r="54" fill="#0a1728" stroke="#67e8f9" stroke-width="10" filter="url(#glow)"/>
  <circle cx="256" cy="210" r="22" fill="#38bdf8" opacity=".22"/>
  <path d="m242 184 44 26-44 26Z" fill="#e0f2fe"/>
  <g fill="#34d399">
    <rect x="115" y="305" width="18" height="18" rx="4"/>
    <rect x="137" y="333" width="12" height="12" rx="3"/>
    <rect x="379" y="305" width="18" height="18" rx="4"/>
    <rect x="363" y="333" width="12" height="12" rx="3"/>
  </g>
</svg>
