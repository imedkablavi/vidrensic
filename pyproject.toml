[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidrensic"
version = "0.6.0a0"
description = "Forensic acquisition, triage and multi-format DVR/NVR video reconstruction platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "imedkablavi"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["forensics", "dvr", "nvr", "cctv", "video-recovery", "wfs", "dhav", "h264", "hevc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/imedkablavi/vidrensic"
Repository = "https://github.com/imedkablavi/vidrensic"
Issues = "https://github.com/imedkablavi/vidrensic/issues"
Documentation = "https://github.com/imedkablavi/vidrensic/tree/main/docs"

[project.scripts]
vidrensic = "vidrensic.product_cli:main"
vidrensic-media = "vidrensic.media_cli:main"
vidrensic-export = "vidrensic.export_cli:main"
vidrensic-profiler = "vidrensic.profiler_cli:main"
vidrensic-scenes = "vidrensic.scene_cli:main"
vidrensic-duplicates = "vidrensic.duplicate_cli:main"
vidrensic-repair = "vidrensic.repair_cli:main"
vidrensic-proxy = "vidrensic.proxy_cli:main"
vidrensic-review = "vidrensic.review_cli:main"
vidrensic-review-ui = "vidrensic.review_ui_cli:main"

[tool.setuptools.packages.find]
include = ["vidrensic*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"vidrensic/review_server.py" = ["F401"]
