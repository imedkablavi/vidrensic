[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidrensic"
version = "0.5.0a0"
description = "Forensic acquisition, triage and multi-format DVR/NVR video reconstruction platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "imedkablavi"}]
license = {text = "Proprietary"}
keywords = ["forensics", "dvr", "nvr", "cctv", "video-recovery", "wfs", "dhav", "h264", "hevc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
vidrensic = "vidrensic.cli:main"

[tool.setuptools.packages.find]
include = ["vidrensic*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
