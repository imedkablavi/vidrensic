name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install qualification and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'build==1.5.0' 'twine==7.0.0' 'cyclonedx-bom==7.3.1'
          python -m pip check

      - name: Source release qualification
        run: |
          ruff check vidrensic tests scripts
          python -m compileall -q vidrensic tests scripts
          pytest
          python scripts/validate_real_corpus_index.py
          vidrensic validate corpus validation_corpus/corpus.json --out source-validation-report.json
          python -c "import json; r=json.load(open('source-validation-report.json')); assert r['status'] == 'PASS'"
          python scripts/profile_wfs_solver.py --starts 5 --options 7 --out solver-profile.json
          python -c "import json; r=json.load(open('solver-profile.json')); assert r['selection_equivalent'] is True"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Verify built wheel and rerun corpus
        run: |
          python -m pip uninstall -y vidrensic
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          vidrensic --version
          vidrensic formats list
          vidrensic validate corpus validation_corpus/corpus.json --out wheel-validation-report.json
          python -c "import json; r=json.load(open('wheel-validation-report.json')); assert r['status'] == 'PASS'"

      - name: Generate validated CycloneDX runtime SBOM
        run: |
          python -m venv .sbom-env
          .sbom-env/bin/python -m pip install --upgrade pip
          .sbom-env/bin/python -m pip install dist/*.whl
          .sbom-env/bin/python -m pip check
          .sbom-env/bin/python -m pip freeze | \
            cyclonedx-py requirements \
              --pyproject pyproject.toml \
              --mc-type library \
              --spec-version 1.6 \
              --output-reproducible \
              --output-format JSON \
              --output-file dist/SBOM.cdx.json \
              -
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('dist/SBOM.cdx.json').read_text(encoding='utf-8'))
          assert data.get('bomFormat') == 'CycloneDX'
          assert data.get('specVersion') == '1.6'
          components = data.get('components') or []
          names = {str(item.get('name', '')).lower() for item in components if isinstance(item, dict)}
          assert 'vidrensic' in names, 'SBOM does not contain the built Vidrensic package'
          PY

      - name: Record resolved runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import platform
          from pathlib import Path

          from packaging.requirements import Requirement

          package = metadata.distribution('vidrensic')
          declared = package.requires or []
          resolved = []
          for raw in declared:
              requirement = Requirement(raw)
              if requirement.marker is not None and not requirement.marker.evaluate():
                  continue
              try:
                  version = metadata.version(requirement.name)
              except metadata.PackageNotFoundError:
                  version = None
              resolved.append(
                  {
                      'name': requirement.name,
                      'declared': raw,
                      'installed_version': version,
                  }
              )

          payload = {
              'schema_version': 1,
              'artifact': 'qualification-runtime-dependency-inventory',
              'package': 'vidrensic',
              'package_version': package.version,
              'python': platform.python_version(),
              'resolved_runtime_requirements': sorted(resolved, key=lambda item: item['name'].lower()),
              'claim_limit': 'Direct runtime requirements resolved in the qualification environment. See SBOM.cdx.json for the CycloneDX runtime inventory.',
          }
          Path('dist/QUALIFICATION-DEPENDENCIES.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Collect qualification evidence
        run: |
          cp source-validation-report.json dist/SOURCE-VALIDATION-REPORT.json
          cp wheel-validation-report.json dist/WHEEL-VALIDATION-REPORT.json
          cp solver-profile.json dist/SOLVER-PROFILE.json
          cp validation_corpus/real/real-corpus-index.json dist/REAL-CORPUS-INDEX.json

      - name: Write build manifest
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          manifest = {
              'schema_version': 4,
              'product': 'Vidrensic',
              'ref': os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ.get('GITHUB_SHA'),
              'workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'python': platform.python_version(),
              'platform': platform.platform(),
              'qualification': {
                  'source_tests': 'passed in this workflow before build',
                  'public_corpus': 'synthetic expectations only',
                  'real_recorder_corpus_index': 'admission metadata only; zero cases does not validate a recorder family',
                  'installed_wheel_corpus': 'synthetic expectations only',
                  'solver_profile': 'synthetic equivalence/profile; not a performance guarantee',
                  'runtime_dependency_inventory': 'direct resolved requirements in qualification environment',
                  'sbom': 'CycloneDX 1.6 generated from an isolated environment containing the built wheel and its resolved runtime dependencies',
              },
              'publication_policy': {
                  'workflow_dispatch': 'qualification artifact only; no release-signature or provenance-attestation claim',
                  'tag': 'publish job must create GitHub provenance/SBOM attestations, Sigstore-sign and verify the qualified payload before GitHub Release upload',
              },
          }
          Path('dist/BUILD-MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum BUILD-MANIFEST.json QUALIFICATION-DEPENDENCIES.json REAL-CORPUS-INDEX.json SBOM.cdx.json SOLVER-PROFILE.json SOURCE-VALIDATION-REPORT.json WHEEL-VALIDATION-REPORT.json *.whl *.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload qualified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vidrensic-${{ github.ref_name }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install pinned signing tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'sigstore==4.5.0'
          python -m pip check

      - name: Download qualified payload from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: vidrensic-${{ github.ref_name }}
        run: |
          mkdir -p release-dist
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-dist
          test -f release-dist/SHA256SUMS.txt
          (cd release-dist && sha256sum -c SHA256SUMS.txt)

      - name: Create GitHub SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release-dist/*'

      - name: Create GitHub SBOM attestation for built wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release-dist/*.whl'
          sbom-path: 'release-dist/SBOM.cdx.json'

      - name: Sign qualified payload with Sigstore keyless identity
        run: |
          for file in release-dist/*; do
            test -f "$file"
            python -m sigstore sign "$file"
          done

      - name: Verify every Sigstore bundle before publication
        run: |
          for file in release-dist/*; do
            case "$file" in
              *.sigstore.json) continue ;;
            esac
            test -f "$file.sigstore.json"
            python -m sigstore verify github "$file" \
              --bundle "$file.sigstore.json" \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$GITHUB_SHA" \
              --ref "$GITHUB_REF"
          done

      - name: Attach signed artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" release-dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
