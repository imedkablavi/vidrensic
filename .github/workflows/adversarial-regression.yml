name: Adversarial regression

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malformed-input-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Run deterministic adversarial regression
        run: |
          python scripts/run_adversarial_regression.py \
            --iterations 3000 \
            --seeds 8 \
            --max-size 8192 \
            --out adversarial-regression.json

      - name: Upload regression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adversarial-regression-${{ github.sha }}
          path: adversarial-regression.json
          if-no-files-found: error
          retention-days: 30
