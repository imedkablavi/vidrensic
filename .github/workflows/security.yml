name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit

  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tracked public text
        run: python scripts/public_hygiene.py

  history-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Scan complete Git history
        run: "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 .
